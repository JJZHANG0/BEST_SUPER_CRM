name: Deploy PROJECT NEXUS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - name: Validate admissions calculations
        run: node tests/recruitment.mjs
      - name: Validate demo authorization
        run: node tests/auth.mjs
      - name: Validate student status ordering
        run: node tests/student-status.mjs
      - name: Validate project articles
        run: node tests/articles.mjs
      - name: Validate ops todos
        run: node tests/todos.mjs
      - name: Validate API client (demo mode stays offline)
        run: node tests/api-client.mjs
      - name: Type-check and bundle API server
        run: npx tsc --noEmit -p . && npm run build:server
      - name: Build static site
        run: npm run build:pages
      - name: Validate exported paths
        run: node tests/static-paths.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
