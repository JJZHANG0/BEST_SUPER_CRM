# PROJECT NEXUS — production on :80 (and :443 after certbot), development on :8080 (HTTP only).
# Domains: bestcrm.cc / www.bestcrm.cc → prod. Bare IP still serves prod on :80 for bootstrap.
# Static: /opt/nexus/<env>/current/web ; API: nexus-api-<env> on 127.0.0.1:<port>.
# HTTPS: after DNS A records point here, run scripts/enable-https.sh (certbot --nginx).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Production — HTTP (certbot will add a matching :443 server and may insert a redirect here).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bestcrm.cc www.bestcrm.cc _;
    root /opt/nexus/prod/current/web;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 推文 share links: per-article Open Graph shell rendered by the API, then redirect into the SPA.
    location /a/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html /index.html; add_header Cache-Control "no-cache"; }
}

# Optional HTTPS vhost (installed by scripts/enable-https.sh once certs exist).
include /etc/nginx/conf.d/nexus-ssl.conf.inc;

# Development — HTTP only on :8080 (never TLS).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /opt/nexus/dev/current/web;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /a/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html /index.html; add_header Cache-Control "no-cache"; }
}
